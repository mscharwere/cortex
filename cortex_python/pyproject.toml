[project]
name = "cortex-python"
version = "0.0.1"
description = "CORTEX — Cross-App Intelligence Fabric runtime (NAS brain)."
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Carlos Perez" },
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiomysql>=0.2",
    "pymysql>=1.1.0,<2.0",
    "alembic>=1.14",
    "redis>=5.2",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pytz>=2024.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Async SQLite driver — test-only. Lets tests/unit/vacuumops/test_priors.py
    # exercise the REAL PriorStore SQL (the A1 occupancy prior learner's
    # read/merge/write path) against a live database instead of only a fake, so a
    # typo in a hand-written statement is caught by CI rather than in production.
    # Not a runtime dependency: production is MariaDB via aiomysql.
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pytz>=2024.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["cortex_python*"]

[tool.setuptools.package-data]
cortex_python = ["py.typed", "**/*.yaml", "**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
