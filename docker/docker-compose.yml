# CORTEX — Production docker-compose (Phase 0 Item 3 — corrective)
#
# Single service: cortex-python (FastAPI brain).
# MariaDB and Redis are SHARED infrastructure on the Synology NAS —
# NOT bundled here.  This matches the established family-app pattern
# (FamilyOps, ProjectOps, BookQuest, Nexus, FamilyAuth all share the
# same external MariaDB at 192.168.30.4:3306).
#
# Shared Redis lives at /volume1/docker/redis/ (see infra/redis/ in this
# repo for its compose + bootstrap README).  Bring that up ONCE before
# starting cortex-python.
#
# Deploy path:
#   1. Run scripts/bootstrap.sql against shared MariaDB (one-time).
#   2. Bring up shared Redis: cd /volume1/docker/redis && docker compose up -d
#   3. Copy this file + .env to /volume1/docker/cortex/ on the NAS.
#   4. docker compose up -d
#   5. docker compose exec cortex-python alembic upgrade head
#
# Secrets: sourced exclusively from .env — NO hardcoded credentials here.
# .env is gitignored; .env.example (repo root) has placeholders.
#
# Spec: C:/Jarvis/Team/TARS/cortex_architecture.md v3.1 §4, Appendix A.

version: "3.9"

services:
  # ────────────────────────────────────────────────────────────────────────────
  # CORTEX-Python — FastAPI brain (NAS side of the split topology).
  # Pulls from GHCR; Watchtower auto-updates on push to main.
  # Connects to shared MariaDB (192.168.30.4:3306) and shared Redis
  # (192.168.30.4:6379) via LAN IP — same pattern as FamilyOps.
  # ────────────────────────────────────────────────────────────────────────────
  cortex-python:
    image: ghcr.io/mscharwere/cortex-python:latest
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: America/Los_Angeles
      # DATABASE_URL assembled from component vars — keeps .env DRY.
      # aiomysql async driver for FastAPI; pymysql sync driver for alembic.
      DATABASE_URL: "mysql+aiomysql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
      # REDIS_URL: logical DB 2 reserved for CORTEX (see infra/redis/README.md).
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}"
      # LiteLLM — canonical hostname per reference_ollama_perwnet_hostname.md
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://ollama.perwnet.com:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      CORTEX_SECRET_KEY: ${CORTEX_SECRET_KEY}
      CORTEX_ENV: ${CORTEX_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # cortex-python is the only service that exposes a host port.
      # Reverse-proxy (Synology + Tailscale) fronts this.
      - "${CORTEX_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
